stages:
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

test:
  stage: test
  image: python:3.12
  tags: [docker, x86_64]
  cache:
    paths:
      - .pip-cache
  script:
    - python -m pip install --quiet -r requirements-dev.txt
    - python -m ruff check .
    - python -m pytest -q --cov=knigojor --cov-fail-under=55 --cov-report=term-missing --cov-report=xml
  artifacts:
    when: always
    paths:
      - coverage.xml

build:x86_64:
  stage: build
  image: python:3.12
  tags: [docker, x86_64]
  script:
    - python -m pip install --quiet -r requirements-dev.txt
    - pyinstaller --onefile --name knigojor --clean --noconfirm main.py
    - ./dist/knigojor --version
  artifacts:
    paths:
      - dist/knigojor
    expire_in: never

build:aarch64:
  stage: build
  image: python:3.12
  tags: [docker, aarch64]
  script:
    - python -m pip install --quiet -r requirements-dev.txt
    - pyinstaller --onefile --name knigojor --clean --noconfirm main.py
    - ./dist/knigojor --version
  artifacts:
    paths:
      - dist/knigojor
    expire_in: never

build:armv7:
  stage: build
  image: python:3.12
  tags: [docker, armv7]
  script:
    - python -m pip install --quiet -r requirements-dev.txt
    - pyinstaller --onefile --name knigojor --clean --noconfirm main.py
    - ./dist/knigojor --version
  artifacts:
    paths:
      - dist/knigojor
    expire_in: never

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags: [docker, x86_64]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    name: "knigojor $CI_COMMIT_TAG"
    description: "Multi-arch binaries"
    assets:
      links:
        - name: "knigojor-x86_64"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/knigojor?job=build:x86_64"
        - name: "knigojor-aarch64"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/knigojor?job=build:aarch64"
        - name: "knigojor-armv7"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/knigojor?job=build:armv7"