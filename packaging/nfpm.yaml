# nfpm config: deb and rpm from a single spec.
# Build: nfpm package -f packaging/nfpm.yaml -p deb|rpm -t dist/
name: knigojor
arch: ${PKG_ARCH}
platform: linux
version: ${VERSION}
maintainer: shabbybastard <17788445+shabbybastard@users.noreply.github.com>
description: |
  Personal Telegram bot for the Flibusta e-book library.
homepage: https://github.com/shabbybastard/knigojor
license: MIT

contents:
  - src: ./bin/knigojor
    dst: /usr/bin/knigojor
  - src: ./knigojor.service
    dst: /usr/lib/systemd/system/knigojor@.service
